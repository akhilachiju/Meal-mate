services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meal-mate-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meal-mate-client
    restart: unless-stopped
    ports:
      - "3000:80"   # http://localhost:3000 
    depends_on:
      - server
